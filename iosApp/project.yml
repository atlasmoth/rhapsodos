name: EReader
options:
  bundleIdPrefix: com.osuji
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.01"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  Phonon:
    path: Vendor
  Argmax:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 0.18.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
  Transformers:
    url: https://github.com/huggingface/swift-transformers.git
    exactVersion: 1.1.6
targets:
  EReader:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: Phonon
        product: PhononRuntime
      - package: Argmax
        product: WhisperKit
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: Transformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osuji.ereaderapp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: EReader.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework SharedCore -lsqlite3"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    preBuildScripts:
      - name: Build SharedCore
        script: |
          if [ "${EREADER_PREBUILT_SHARED:-0}" != "1" ]; then
            cd "$SRCROOT/.."
            ./gradlew :shared:embedAndSignAppleFrameworkForXcode
          fi
        basedOnDependencyAnalysis: false
    scheme:
      gatherCoverageData: false
      build:
        targets:
          EReader: all
      run:
        config: Debug
      archive:
        config: Release
